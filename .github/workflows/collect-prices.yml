name: Collect PoE2 Prices

# poe2scout → merged history + today's UTC snapshot → site price index.
# Cloudflare Pages' existing Git integration deploys the data commit on main.
on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/collect-prices.yml'
      - '.claude/skills/price-forecast/scripts/**'
      - '.claude/skills/nuxt/scripts/build-prices/**'
      - 'app/types/poe-item.ts'
      - 'app/utils/itemSlug.ts'
      - 'tsconfig.prices.json'
      - 'package.json'
      - 'bun.lock'

concurrency:
  group: collect-prices-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python certificate bundle
        run: pip install --quiet --no-cache-dir certifi
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - name: Install locked dependencies
        # The standalone price compiler does not need nuxt prepare.
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Test price pipeline guards
        run: bun run test:prices
      - name: Collect prices from poe2scout
        if: github.event_name != 'pull_request'
        # Reads currentLeague from nuxt.config.ts; refreshes every run, keeps history.
        run: python .claude/skills/price-forecast/scripts/collect.py
      - name: Build site price index
        if: github.event_name != 'pull_request'
        run: bun run build:prices
      - name: Typecheck price index
        run: bun run typecheck:prices
      - name: Summarize snapshot
        if: github.event_name != 'pull_request'
        run: |
          # shellcheck disable=SC2016
          bun -e '
            import { PRICES } from "./app/composables/data/prices.generated.ts";
            console.log(`${PRICES.league}: ${Object.keys(PRICES.items).length} items; 1 Divine = ${PRICES.divine_chaos} ex`);
          ' >> "$GITHUB_STEP_SUMMARY"
      - name: Commit and push snapshot
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Fail on any concurrent update. Rebasing generated prices onto a new
          # league/config can publish mismatched data; the next scheduled run retries.
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "::error::main changed during collection; rerun against the new commit"
            exit 1
          fi
          git add data/price-history/master.json data/price-history/daily/ app/composables/data/prices.generated.ts
          if git diff --cached --quiet; then
            echo "No new data"
            exit 0
          fi
          git commit -m "data: POE2 price snapshot $(date -u +%Y-%m-%dT%H:%M)"
          git push origin HEAD:main
